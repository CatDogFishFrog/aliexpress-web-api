[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aliweb"
version = "0.2.1"
description = "Unofficial AliExpress Web API based on scraping (patchright)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "browserforge-stealth @ git+https://github.com/CatDogFishFrog/browserforge-stealth.git",
    "patchright>=1.58",
    "cryptography>=44.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
]

[project.scripts]
aliweb = "aliweb.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aliweb"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PIE", "RET", "RUF", "S", "T20", "ASYNC", "PTH", "TID"]
ignore = [
    "S101",   # assert is allowed in tests
    "RUF001", "RUF002", "RUF003",  # Allow non-ASCII punctuation in strings and comments.
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "S108", "S311", "T20", "ASYNC109", "ASYNC240", "RUF059"]
"src/aliweb/cli/**" = ["T20"]   # print is allowed only in the CLI

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
packages = ["aliweb"]
warn_unreachable = true
